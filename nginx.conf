server {
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; script-src 'self'; form-action 'self'; base-uri 'none'";
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff";
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), attribution-reporting=(), autoplay=(self), bluetooth=(), browsing-topics=(), camera=(), compute-pressure=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), gamepad=(), geolocation=(), gyroscope=(), hid=(), indentity-credentials-get=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(self), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), speaker-selection=(), storage-access=(), usb=(), web-share=(), window-management=(), xr-spatial-tracking=()";

    listen       8080 default_server;
    server_name  _;

    root     /var/www/binternet;
    index    index.php;
    absolute_redirect off;

    location / {
        try_files $uri $uri/ @pinterest;
    }

    location @pinterest {
        rewrite ^/search/pins/?$ /search.php redirect;
        rewrite ^/pin/(\d+)/?$ /pin.php?id=$1? redirect;
        rewrite ^/(\w+)/_\w+/?$ /user.php?user=$1? redirect;
        rewrite ^/(\w+)/?$ /user.php?user=$1? redirect;
        rewrite ^/(\w+)/([^/]+)(?:/[^/]+)?/?$ /board.php?user=$1&board=$2? redirect;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip              on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    open_file_cache          max=1000 inactive=60s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    location ^~ /static/ {
        expires 1d;
    }

    location = /misc/style-dark.css {
        expires 1h;
    }

    # Path-based proxy for images, videos and HLS. Keeping the playlist path
    # intact lets relative segment URLs resolve back through this location.
    location ^~ /media/ {
        access_log     /var/log/nginx/access.log combined buffer=32k flush=5s;
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php-fpm85.sock;
        fastcgi_keep_conn on;
        fastcgi_param  SCRIPT_FILENAME $document_root/media_proxy.php;
        fastcgi_param  SCRIPT_NAME /media_proxy.php;
        fastcgi_param  PATH_INFO "";
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
    }

    # Legacy image proxy links are handled by the same PHP file as /media/.
    location = /image_proxy.php {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php-fpm85.sock;
        fastcgi_keep_conn on;
        fastcgi_param  SCRIPT_FILENAME $document_root/media_proxy.php;
        fastcgi_param  SCRIPT_NAME /media_proxy.php;
        fastcgi_param  PATH_INFO "";
    }

    location ~ \.php$ {
        fastcgi_pass   unix:/run/php/php-fpm85.sock;
        fastcgi_index  index.php;
        fastcgi_keep_conn on;
        fastcgi_param  PATH_INFO $path_info;
        fastcgi_param  SCRIPT_FILENAME    $document_root$fastcgi_script_name;

        fastcgi_split_path_info         ^(.+?\.php)(/.*)$;
        try_files $fastcgi_script_name  =404;
        set $path_info                  $fastcgi_path_info;

        include        fastcgi_params;
    }
}
